
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Loja</title>

    <link rel="stylesheet" href="css/global.css?v=2">
</head>

<body>

    <header class="header">

        <h1>Minha Loja</h1>

        <nav>
            <a href="index.html">Início</a>

            <a href="carrinho.html">
                Carrinho 🛒
                <span id="quantidade-carrinho">0</span>
            </a>
        </nav>

    </header>

    <main>

        <!-- APRESENTAÇÃO -->

        <section class="hero">

            <h2>Bem-vindo à nossa loja</h2>

            <p>
                Encontre os melhores produtos para você.
            </p>

        </section>

        <!-- CADASTRO DE PRODUTOS -->

        <section class="cadastro-produto">

            <h2>Cadastrar novo produto</h2>

            <form id="form-produto">

                <div>
                    <label for="nome-produto">
                        Nome do produto
                    </label>

                    <input
                        type="text"
                        id="nome-produto"
                        placeholder="Digite o nome do produto"
                        maxlength="100"
                        required
                    >
                </div>

                <div>
                    <label for="preco-produto">
                        Preço (R$)
                    </label>

                    <input
                        type="number"
                        id="preco-produto"
                        placeholder="Ex.: 199.90"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit" id="btn-cadastrar">
                    Cadastrar produto
                </button>

            </form>

        </section>

        <!-- LISTAGEM DE PRODUTOS -->

        <section class="produtos">

            <h2>Produtos</h2>

            <div id="lista-produtos"></div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
